name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10, 3.11]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test imports
      run: |
        python -c "import src.mltest; print('Import successful')"

    - name: Check dashboard syntax
      run: |
        python -m py_compile dashboard.py
        python -c "import streamlit; print('Streamlit available')"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create deployment package
      run: |
        mkdir deploy
        cp -r src/ deploy/
        cp app.py dashboard.py run_dashboard.py requirements.txt README.md LICENSE deploy/
        mkdir -p deploy/artifacts deploy/mlruns
        echo "# Placeholder files" > deploy/artifacts/.gitkeep
        echo "# Placeholder files" > deploy/mlruns/.gitkeep

    - name: Upload deployment artifact
      uses: actions/upload-artifact@v4
      with:
        name: ml-project-deploy
        path: deploy/